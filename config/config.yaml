# ===============================================================
# TrendRadar 极简第一阶段配置（自媒体 0 API 成本精简版）
# ===============================================================

app:
  timezone: "Asia/Shanghai"           # 北京时间 UTC+8
  show_version_update: false          # 关闭更新提示，保持简洁

# 调度与推送模式
schedule:
  enabled: true                       # 开启定时调度
  preset: "morning_evening"           # 每天早晚推送模式（适合早会/晨间选题）

report:
  mode: "current"                     # 当前在榜热点模式（展示实时关注度最高的事件）
  display_mode: "keyword"             # 按关键词分组显示（便于分类看选题）
  rank_threshold: 5                   # 前 5 名高亮强调
  max_news_per_keyword: 5             # 每个关键词最多展示 5 条爆款，防信息过载

# 平台数据源（精选自媒体核心 5 大流量池）
platforms:
  enabled: true
  api_url: ""                         # 留空即使用官方免费内置聚合源
  sources:
    - id: "weibo"
      name: "微博热搜"
    - id: "douyin"
      name: "抖音热榜"
    - id: "zhihu"
      name: "知乎热榜"
    - id: "bilibili-hot-search"
      name: "B站热搜"
    - id: "toutiao"
      name: "今日头条"

# RSS 抓取（初级阶段建议先关闭，专注爆款热搜）
rss:
  enabled: false

# 过滤模式（关键：设为纯关键词模式，彻底不碰 LLM/Token）
filter:
  method: "keyword"

# 显示区域（彻底关闭 AI 区域）
display:
  region_order:
    - hotlist                         # 仅展示命中我们关键词的热榜
  regions:
    hotlist: true
    new_items: false
    rss: false
    standalone: false
    ai_analysis: false                # 关键：关闭 AI 分析区

# 推送通知渠道（根据你平时最常用的办公/即时通讯工具选填一个即可）
notification:
  enabled: true
  channels:
    # 【首选推荐】飞书自定义机器人（手机/电脑都能秒收富文本卡片）
    feishu:
      webhook_url: "https://open.feishu.cn/open-apis/bot/v2/hook/xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"

    # 【备选 1】企业微信群机器人（微信能直接收到群消息）
    wework:
      webhook_url: ""                 # 如用企微，在此填入 https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx
      msg_type: "markdown"

    # 【备选 2】钉钉机器人
    dingtalk:
      webhook_url: ""

    # 【备选 3】Telegram 机器人（适合习惯 TG 的博主）
    telegram:
      bot_token: ""
      chat_id: ""

    # 【备选 4】iPhone 专属推送（Bark App）
    bark:
      url: ""                         # 格式：https://api.day.app/你的Key/

storage:
  backend: "auto"
